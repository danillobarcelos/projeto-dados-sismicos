name: Ingestao diaria de dados sismicos


on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingestao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Criar config.py com a connection string
        run: echo "DATABASE_URL = '${{ secrets.DATABASE_URL }}'" > src/config.py

      - name: Rodar ingest.py
        run: python src/ingest.py